<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17223b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Pokémon Infinite: fangame personal jugable sin conexión.">
<title>Pokémon Infinite</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><div class="empty" style="margin-top:40vh;text-align:center">Cargando Pokémon Infinite…<br><small id="boot-msg">La primera vez tarda un poco: descarga el juego entero para que funcione sin internet.</small></div></div>
<script>
// Si algo falla antes de que arranque el juego, lo muestra en pantalla en vez de dejarla en blanco.
(function () {
	function show(msg) {
		var el = document.getElementById('boot-msg');
		if (el) el.innerHTML = 'Error al arrancar: <b>' + String(msg).replace(/</g, '&lt;') + '</b><br>Mándale una captura de esto a Claude.<br><br><button class="btn" onclick="location.reload()">Reintentar</button>';
	}
	window.addEventListener('error', function (e) { show((e.message || 'archivo no cargado') + (e.filename ? ' · ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '') + (e.target && e.target.src ? ' · ' + e.target.src : '')); }, true);
	window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
	setTimeout(function () { var el = document.getElementById('boot-msg'); if (el && !/Error/.test(el.innerHTML)) el.innerHTML += '<br><br>Sigue cargando… si pasa más de un minuto, recarga la página.'; }, 20000);
})();
</script>
<script type="module" src="js/main.js" onerror="document.getElementById('boot-msg').innerHTML='No se pudo descargar js/main.js. Revisa la conexión y recarga.'"></script>
</body>
</html>
