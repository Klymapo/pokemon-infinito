<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17223b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Pokémon Infinite: fangame personal jugable sin conexión.">
<title>Pokémon Infinite</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><div class="empty" style="margin-top:40vh;text-align:center">Cargando Pokémon Infinite…<br><small id="boot-msg">La primera vez tarda un poco: descarga el juego entero para que funcione sin internet.</small></div></div>
<script>
// Si algo falla antes de que arranque el juego, lo muestra en pantalla en vez de dejarla en blanco.
(function () {
	function show(msg) {
		var el = document.getElementById('boot-msg');
		if (el) el.innerHTML = 'Error al arrancar: <b>' + String(msg).replace(/</g, '&lt;') + '</b><br>Mándale una captura de esto a Claude.<br><br><button class="btn" onclick="location.reload()">Reintentar</button>';
	}
	window.addEventListener('error', function (e) { show((e.message || 'archivo no cargado') + (e.filename ? ' · ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '') + (e.target && e.target.src ? ' · ' + e.target.src : '')); }, true);
	window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
	setTimeout(function () { var el = document.getElementById('boot-msg'); if (el && !/Error/.test(el.innerHTML)) el.innerHTML += '<br><br>Sigue cargando… si pasa más de un minuto, recarga la página.'; }, 20000);
})();
</script>
<script type="module" src="js/main.js" onerror="diagnose()"></script>
<script>
// Diagnóstico: si el juego no descarga, revisa archivo por archivo cuál falla y lo muestra.
function diagnose() {
	var el = document.getElementById('boot-msg');
	el.innerHTML = 'No se pudo descargar el juego. Revisando archivos…';
	var files = ['js/main.js', 'js/data.js', 'js/content.js', 'js/state.js', 'js/time.js', 'js/util.js', 'js/art.js', 'js/ai.js', 'js/battle.js', 'js/pokemon.js', 'js/guion.js', 'js/world.js', 'js/ui/core.js', 'js/ui/screens.js', 'js/ui/battle-ui.js', 'lib/battle-text.js', 'lib/ps-sim.js'];
	Promise.all(files.map(function (f) {
		var t0 = Date.now();
		return fetch(f, { cache: 'no-store' }).then(function (r) {
			return r.text().then(function (txt) { return { f: f, ok: r.ok && /javascript/.test(r.headers.get('content-type') || ''), info: r.status + ' · ' + (r.headers.get('content-type') || 'sin tipo') + ' · ' + Math.round(txt.length / 1024) + ' KB · ' + (Date.now() - t0) + ' ms' }; });
		}).catch(function (e) { return { f: f, ok: false, info: 'error de red: ' + e.message + ' · ' + (Date.now() - t0) + ' ms' }; });
	})).then(function (res) {
		var bad = res.filter(function (r) { return !r.ok; });
		el.innerHTML = (bad.length ? '<b>Fallan ' + bad.length + ' archivo(s):</b><br>' + bad.map(function (r) { return r.f + ' → ' + r.info; }).join('<br>') : 'Todos los archivos se descargan bien (' + navigator.userAgent.replace(/</g, '') + ').') +
			'<br><br>Mándale una captura de esto a Claude.<br><br><button class="btn" onclick="location.reload()">Reintentar</button>';
	});
}
</script>
</body>
</html>
